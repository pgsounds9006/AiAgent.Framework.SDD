name: Release skill

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches SKILL.md version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SKILL_VERSION="$(grep -m1 '^version:' src/skills/software-development/SKILL.md | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')"
          echo "tag=$TAG_VERSION  skill=$SKILL_VERSION"
          if [ "$TAG_VERSION" != "$SKILL_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG_VERSION) does not match SKILL.md version $SKILL_VERSION"
            exit 1
          fi

      - name: Package skill
        run: bash scripts/package-skill.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            software-development.skill \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
